# Render Blueprint: the game server (FastAPI + WebSockets).
# New > Blueprint > pick this repo. The frontend goes on Vercel (see README).
services:
  - type: web
    name: telepathy-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Comma-separated list of sites allowed to call the API, e.g. https://telepathy.vercel.app
      - key: ALLOWED_ORIGINS
        value: "*"
